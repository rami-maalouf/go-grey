<!doctype html>
<html lang="en" class="toolbar-popup">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Stillfeed</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icons/48.png" width="32" height="32" alt="" />
      <h1>Stillfeed</h1>
    </header>
    <main>
      <section id="card">
        <label id="tabRow" for="tabGray" hidden>
          <span
            ><strong>Grayscale this tab</strong><span id="context"></span
          ></span>
          <input
            id="tabGray"
            type="checkbox"
            role="switch"
            aria-label="Grayscale this tab"
            aria-describedby="context"
          />
        </label>
        <button id="resetTab" type="button" hidden>Use site default</button>
        <p id="tabNotice" role="status">Loading…</p>
      </section>
      <section>
        <div class="section-head">
          <h3>Grayscale sites</h3>
          <button id="manage" type="button">Manage sites</button>
        </div>
        <button id="addSite" type="button" hidden>Add this site</button>
        <div id="sites"></div>
      </section>
      <section>
        <h3 id="pauseTitle">Pause all sites</h3>
        <div id="times" role="group" aria-labelledby="pauseTitle"></div>
        <button id="resume" hidden>Resume grayscale</button>
      </section>
      <p id="error" role="alert" hidden></p>
    </main>
    <script src="sites.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
